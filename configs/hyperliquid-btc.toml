# Make markets in BTC on Hyperliquid.
#   cargo run -- run configs/hyperliquid-btc.toml          (dry run, as shipped)
#   cargo run -- run configs/hyperliquid-btc.toml --live   (real money: read "Going live" in the README)
# Every number is a placeholder to learn with, not a tuned value.

venue = "hyperliquid"
network = "mainnet"

# true: watch the market and log the quotes we WOULD place. No key, no money.
dry_run = true
key_file = "hyperliquid.key"  # cargo run -- keygen --venue hyperliquid
# sub_account = "0x..."       # trade a sub-account instead (its own request allowance)

# Quote BTC on Hyperliquid, using Binance's BTC perp as the price reference.
symbol = "BTC"
binance_symbol = "BTCUSDT"

# --- Strategy ---
spread_bps = "10"             # quote 0.10% either side of fair value
order_size = "0.0002"         # BTC per order. Hyperliquid refuses orders under $10; the bot checks at startup.
max_position = "0.0004"       # never hold more than this, long or short
skew_bps = "5"                # at max position, lean both quotes 0.05% to unwind
requote_threshold_bps = "5"   # replace a quote once it is this far (bps) off where we want it
min_requote_ms = 2000         # but at most this often
#   Hyperliquid allows 10,000 requests, then 1 more per $1 traded: requote sparingly.
quote_ttl_secs = 30           # if the bot dies, Hyperliquid cancels our orders 30s later (dead man's switch)

# --- Safety ---
max_loss_usd = "3"            # stop quoting for this run after losing this much (fees included)
reference_stale_secs = 5      # no Binance price for 5s: pull quotes
book_stale_secs = 10          # no Hyperliquid book update for 10s: pull quotes
basis_halflife_secs = 300     # average the Binance-Hyperliquid gap over ~5 minutes

# --- Watching it ---
metrics_port = 9005           # latency metrics for Grafana; each bot its own port so several can run
