# Make markets in ETH on Bullet.
#   cargo run -- run configs/bullet-eth.toml          (dry run, as shipped)
#   cargo run -- run configs/bullet-eth.toml --live   (real money: read "Going live" in the README)
# Every number is a placeholder to learn with, not a tuned value.

venue = "bullet"
network = "mainnet"

# true: watch the market and log the quotes we WOULD place. No key, no money.
dry_run = true
key_file = "bot.key"          # cargo run -- keygen

# Quote ETH on Bullet, using Binance's ETH perp as the price reference.
symbol = "ETH-USD"
binance_symbol = "ETHUSDT"

# --- Strategy ---
spread_bps = "10"             # quote 0.10% either side of fair value
order_size = "0.002"          # ETH per order. The bot checks it against Bullet's minimum at startup.
max_position = "0.004"        # never hold more than this, long or short
skew_bps = "5"                # at max position, lean both quotes 0.05% to unwind
requote_threshold_bps = "3"   # replace a quote once it is this far (bps) off where we want it
min_requote_ms = 500          # but at most this often
quote_ttl_secs = 30           # our orders expire after 30s (refreshed every 15s) if the bot dies

# --- Safety ---
max_loss_usd = "2"            # stop quoting for this run after losing this much (fees included)
reference_stale_secs = 5      # no Binance price for 5s: pull quotes
book_stale_secs = 10          # no Bullet book update for 10s: pull quotes
basis_halflife_secs = 300     # average the Binance-Bullet gap over ~5 minutes

# --- Watching it ---
metrics_port = 9001           # latency metrics for Grafana; each bot its own port so several can run
